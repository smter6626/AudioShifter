name: Record runtime cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/record-runtime-cleanup.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update runtime record
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/macos_rebuild_runtime.md")
          text = path.read_text(encoding="utf-8")

          entry = (
              "- 2026-08-04：清理已废弃的未公开 Release 候选：用户通过 `gh release delete` "
              "删除 alpha.1 Draft ID `364786397` 和 alpha.2 Draft ID `364826053`，且未使用 "
              "`--cleanup-tag`。`gh release list` 现仅保留公开的 `v0.1.0-alpha.3` Pre-release；"
              "远端 annotated tags `v0.1.0-alpha.1`、`v0.1.0-alpha.2` 和 "
              "`v0.1.0-alpha.3` 均继续存在，并分别解析到原有 release commit。该清理仅移除"
              "从未公开且已被后续候选取代的 Draft Release 及其附件，不改变历史 tag、源码或"
              "公开 alpha.3 资产。\n"
          )
          marker = "\n# completed step specification — macOS runnable MVP"
          if entry not in text:
              if marker not in text:
                  raise SystemExit("runtime insertion marker not found")
              text = text.replace(marker, "\n" + entry + marker, 1)

          old = (
              "- `v0.1.0-alpha.3` 已完成人工验收并公开为 GitHub Pre-release；"
              "alpha.1 和 alpha.2 内部 Draft 保持不变。是否进入 Developer ID 签名与 "
              "Apple 公证阶段仍另行决定。"
          )
          new = (
              "- `v0.1.0-alpha.3` 已完成人工验收并公开为 GitHub Pre-release；"
              "alpha.1 和 alpha.2 的未公开 Draft Release 已删除，两个历史 annotated tags "
              "继续保留用于审计与复现。是否进入 Developer ID 签名与 Apple 公证阶段仍另行决定。"
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("runtime next-steps text not found")

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/macos_rebuild_runtime.md
          git diff --cached --check
          git commit -m "docs: record removal of superseded draft releases"
          git push origin HEAD:main
