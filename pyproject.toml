[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audioshifter"
version = "0.1.0"
description = "AudioShifter macOS local audio pitch and tempo processor"
requires-python = ">=3.11"

[project.scripts]
audioshifter = "audioshifter.__main__:main"

[tool.setuptools]
package-dir = {"" = "macos/src"}

[tool.setuptools.packages.find]
where = ["macos/src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["macos/tests"]
markers = [
  "integration: starts the real FFmpeg, FFprobe, or Rubber Band toolchain",
]
